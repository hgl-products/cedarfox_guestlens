        <style>
            :root {
                --bg: #faf7f2;
                --card: #fffdf9;
                --card-2: #f6f1e9;
                --ink: #1c1917;
                --ink-2: #57534e;
                --ink-3: #a09a90;
                --hair: #e9e2d8;
                --accent: #c2410c;
                --brand-a: #38bdf8;
                --brand-b: #0284c7;
                --crit: #d03b3b;
                --logo-blend: multiply;
                --logo-filter: none;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #14110e;
                    --card: #211d19;
                    --card-2: #2a2520;
                    --ink: #f5f0ea;
                    --ink-2: #c7bfb4;
                    --ink-3: #8a8378;
                    --hair: #35302a;
                    --accent: #f97316;
                    --brand-a: #0ea5e9;
                    --brand-b: #075985;
                    --crit: #f87171;
                    --logo-blend: screen;
                    --logo-filter: invert(1) hue-rotate(180deg);
                }
            }
            * { box-sizing: border-box; margin: 0; padding: 0; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                background: var(--bg);
                color: var(--ink);
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-content {
                min-height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .brand-logo {
                height: 34px;
                margin-bottom: 26px;
                mix-blend-mode: var(--logo-blend);
                filter: var(--logo-filter);
            }
            .staticrypt-form {
                background: var(--card);
                border: 1px solid var(--hair);
                border-radius: 18px;
                box-shadow: 0 1px 2px rgba(28, 25, 23, 0.04), 0 14px 44px rgba(120, 80, 40, 0.1);
                width: min(400px, 92vw);
                padding: 38px 36px 32px;
                text-align: center;
            }
            .eyebrow {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 2.2px;
                text-transform: uppercase;
                color: var(--accent);
                margin-bottom: 12px;
            }
            .staticrypt-title {
                font-size: 30px;
                font-weight: 800;
                letter-spacing: -0.02em;
                background: linear-gradient(120deg, var(--brand-a), var(--brand-b));
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent;
                margin-bottom: 8px;
            }
            .staticrypt-instructions p:last-child {
                font-size: 13.5px;
                color: var(--ink-2);
                line-height: 1.6;
                margin-bottom: 24px;
            }
            .staticrypt-password-container {
                position: relative;
                background: var(--card-2);
                border: 1px solid var(--hair);
                border-radius: 12px;
                margin-bottom: 14px;
                transition: border-color 0.15s;
            }
            .staticrypt-password-container:focus-within {
                border-color: var(--brand-b);
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                outline: 0;
                font-size: 15px;
                font-family: inherit;
                color: var(--ink);
                padding: 14px 46px 14px 16px;
                width: 100%;
            }
            .staticrypt-form input::placeholder { color: var(--ink-3); }
            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.45;
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
            }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility { filter: invert(1); }
            }
            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 9px;
                font-size: 13px;
                color: var(--ink-2);
                margin-bottom: 18px;
                cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] {
                width: 16px;
                height: 16px;
                accent-color: var(--brand-b);
                cursor: pointer;
            }
            .staticrypt-decrypt-button {
                width: 100%;
                border: 0;
                border-radius: 12px;
                padding: 14px;
                font-family: inherit;
                font-size: 15px;
                font-weight: 700;
                color: #ffffff;
                cursor: pointer;
                background: linear-gradient(120deg, var(--brand-a), var(--brand-b));
                box-shadow: 0 8px 24px rgba(2, 132, 199, 0.3);
                transition: transform 0.15s, filter 0.15s;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus {
                filter: brightness(1.08);
                transform: translateY(-1px);
            }
            .staticrypt-error {
                display: none;
                font-size: 13px;
                font-weight: 600;
                color: var(--crit);
                margin-top: 14px;
            }
            .staticrypt-error.show { display: block; animation: shake 0.35s; }
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-6px); }
                75% { transform: translateX(6px); }
            }
            @media (prefers-reduced-motion: reduce) {
                .staticrypt-error.show { animation: none; }
                .staticrypt-decrypt-button:hover { transform: none; }
            }
            .footer-line {
                margin-top: 26px;
                font-size: 11.5px;
                color: var(--ink-3);
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 2.2rem;
                height: 2.2rem;
                border: 0.25em solid var(--hair);
                border-right-color: var(--brand-b);
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>
